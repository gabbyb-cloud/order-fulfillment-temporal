name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ORDER_API_KEY: ci-test-key
      TEMPORAL_ADDRESS: localhost:7233

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Start Temporal infrastructure
        run: docker compose up -d postgresql temporal

      - name: Wait for Temporal
        run: |
          python - <<'PY'
          import asyncio

          from temporalio.client import Client


          async def wait_for_temporal():
              for attempt in range(30):
                  try:
                      await Client.connect("127.0.0.1:7233")
                      print("Temporal is ready")
                      return
                  except Exception as exc:
                      print(
                          f"Waiting for Temporal... "
                          f"attempt {attempt + 1}/30 "
                          f"({type(exc).__name__})"
                      )
                      await asyncio.sleep(2)

              raise SystemExit("Temporal did not become ready in time")


          asyncio.run(wait_for_temporal())
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs temporal postgresql
